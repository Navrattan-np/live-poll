name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  cluster-test:
    # Real distributed check: 2 containers + Redis; vote on B, read on A.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t live-poll .
      - name: Start Redis and two servers
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for X in "A 8001" "B 8002"; do set -- $X
            docker run -d --network host -e PORT=$2 -e INSTANCE_NAME=$1 \
              -e REDIS_URL=redis://localhost:6379 live-poll
          done
          for P in 8001 8002; do
            for i in $(seq 1 30); do curl -sf localhost:$P/health && break; sleep 1; done
          done
      - name: Vote on server B, read result from server A
        run: |
          curl -sf -X POST localhost:8001/api/host/start -H 'X-Host-Key: host' \
            -H 'Content-Type: application/json' -d '{"question":"Q?","options":["a","b"]}'
          curl -sf -X POST localhost:8002/api/vote -H 'Content-Type: application/json' \
            -d '{"client":"ci-user","option":0}'
          curl -sf localhost:8001/api/state | tee /dev/stderr | grep -q '"total":1'

  deploy:
    needs: [test, cluster-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC login to Azure, no client secrets
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build image in ACR (cloud build, no local Docker)
        run: az acr build --registry "${{ vars.ACR_NAME }}" --image "livepoll:${{ github.sha }}" .
      - name: Roll out to servers A and B
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/livepoll:${{ github.sha }}"
          for APP in "${{ vars.APP_A }}" "${{ vars.APP_B }}"; do
            az containerapp update --resource-group "${{ vars.RESOURCE_GROUP }}" \
              --name "$APP" --container poll --image "$IMAGE" --output none
          done
